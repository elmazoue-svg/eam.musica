<!DOCTYPE html>
<html lang="es" class="h-full bg-zinc-950 text-zinc-100 dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drive Audio Player PWA</title>
  <meta name="theme-color" content="#09090b">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- PWA Manifest Injection -->
  <script>
    const manifest = {
      name: "Drive Music Player",
      short_name: "DrivePlayer",
      start_url: "./",
      display: "standalone",
      background_color: "#09090b",
      theme_color: "#09090b",
      icons: [{
        src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2'><circle cx='12' cy='12' r='10'/><path d='M10 8l6 4-6 4V8z'/></svg>",
        sizes: "192x192 512x512",
        type: "image/svg+xml"
      }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
    document.head.appendChild(link);
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased select-none bg-zinc-950 text-zinc-100 overflow-hidden">

  <!-- Header -->
  <header class="h-16 border-b border-zinc-800/80 px-4 sm:px-6 flex items-center justify-between bg-zinc-900/50 backdrop-blur shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-green-500/10 border border-green-500/20 flex items-center justify-center text-green-400">
        <i data-lucide="music-2" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-none text-zinc-100">Drive Music</h1>
        <span class="text-xs text-zinc-400 font-medium">PWA Cloud Player</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <div id="status-badge" class="hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span>Desconectado</span>
      </div>
      
      <button id="auth-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-green-500 hover:bg-green-400 text-zinc-950 font-semibold text-sm transition shadow-lg shadow-green-500/10 active:scale-95">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Conectar Drive</span>
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="flex border-b border-zinc-800 bg-zinc-900/30 px-4 shrink-0">
    <button id="tab-all" class="px-4 py-3 text-sm font-semibold text-green-400 border-b-2 border-green-500 flex items-center gap-2 transition">
      <i data-lucide="list-music" class="w-4 h-4"></i>
      <span>Toda la Música</span>
    </button>
    <button id="tab-playlists" class="px-4 py-3 text-sm font-medium text-zinc-400 border-b-2 border-transparent hover:text-zinc-200 flex items-center gap-2 transition">
      <i data-lucide="library" class="w-4 h-4"></i>
      <span>Listas de Reproducción</span>
    </button>
  </div>

  <!-- Main Area -->
  <main class="flex-1 flex flex-col min-h-0 relative">
    
    <!-- Controls Bar -->
    <div class="p-4 border-b border-zinc-800/50 bg-zinc-900/20 flex flex-col sm:flex-row gap-3 items-center justify-between shrink-0">
      <div class="relative w-full sm:max-w-md">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400"></i>
        <input type="text" id="search-input" placeholder="Buscar canciones..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-4 py-2 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-green-500/50 transition">
      </div>
      
      <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-3 text-xs text-zinc-400">
        <button id="create-playlist-btn" class="hidden flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-medium transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Nueva Playlist</span>
        </button>
        <button id="refresh-btn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-zinc-800 hover:bg-zinc-800 text-zinc-300 transition">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Actualizar</span>
        </button>
      </div>
    </div>

    <!-- Content Views -->
    <div class="flex-1 overflow-y-auto p-4">
      
      <!-- All Music View -->
      <div id="view-all" class="space-y-1">
        <div id="empty-state" class="p-12 text-center text-zinc-500 space-y-2">
          <i data-lucide="disc" class="w-12 h-12 mx-auto text-zinc-600"></i>
          <p class="text-sm">Conecta tu cuenta para cargar canciones desde tu Google Drive.</p>
        </div>
        <div id="track-list" class="space-y-1"></div>
      </div>

      <!-- Playlists View -->
      <div id="view-playlists" class="hidden space-y-4">
        <div id="playlists-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

    </div>
  </main>

  <!-- Player Dock -->
  <footer class="bg-zinc-900 border-t border-zinc-800/80 p-4 shrink-0 shadow-2xl relative z-10">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      
      <!-- Track Details -->
      <div class="flex items-center gap-3.5 w-full md:w-1/3 min-w-0">
        <div class="w-12 h-12 rounded-lg bg-zinc-800 border border-zinc-700/50 flex items-center justify-center shrink-0 text-zinc-400 relative overflow-hidden">
          <i id="track-icon" data-lucide="music" class="w-6 h-6"></i>
        </div>
        <div class="min-w-0 flex-1">
          <h4 id="current-title" class="text-sm font-semibold text-zinc-100 truncate">Ninguna pista seleccionada</h4>
          <p id="current-artist" class="text-xs text-zinc-400 truncate">Google Drive Storage</p>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="flex flex-col items-center gap-2 w-full md:w-1/3">
        <div class="flex items-center gap-4">
          <button id="shuffle-btn" title="Modo Aleatorio" class="text-zinc-500 hover:text-zinc-200 transition"><i data-lucide="shuffle" class="w-4 h-4"></i></button>
          <button id="prev-btn" class="text-zinc-400 hover:text-zinc-100 transition"><i data-lucide="skip-back" class="w-5 h-5"></i></button>
          <button id="play-btn" class="w-10 h-10 rounded-full bg-zinc-100 hover:bg-white text-zinc-950 flex items-center justify-center transition shadow-md active:scale-95">
            <i data-lucide="play" class="w-5 h-5 fill-current translate-x-0.5"></i>
          </button>
          <button id="next-btn" class="text-zinc-400 hover:text-zinc-100 transition"><i data-lucide="skip-forward" class="w-5 h-5"></i></button>
          <button id="repeat-btn" title="Repetir" class="text-zinc-500 hover:text-zinc-200 transition"><i data-lucide="repeat" class="w-4 h-4"></i></button>
        </div>

        <div class="w-full flex items-center gap-2 text-[11px] font-mono text-zinc-400">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-bar" min="0" max="100" value="0" class="w-full h-1 bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-green-500">
          <span id="total-time">0:00</span>
        </div>
      </div>

      <!-- Volume -->
      <div class="hidden md:flex items-center justify-end gap-3 w-1/3 text-zinc-400">
        <i data-lucide="volume-2" class="w-4 h-4"></i>
        <input type="range" id="volume-bar" min="0" max="1" step="0.05" value="1" class="w-24 h-1 bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-green-500">
      </div>

    </div>
  </footer>

  <audio id="audio-element" class="hidden"></audio>

  <script>
    const CLIENT_ID = '187503199873-5c1al1d1a31tq0rqtcm24rlgkt5ltc60.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

    let tokenClient, accessToken = null;
    let allTracks = [], currentQueue = [], currentTrackIndex = -1;
    let playlists = JSON.parse(localStorage.getItem('gdrive_playlists') || '[]');
    let isShuffle = false, repeatMode = 0; // 0: off, 1: all, 2: one

    // UI Elements
    const authBtn = document.getElementById('auth-btn');
    const statusBadge = document.getElementById('status-badge');
    const trackList = document.getElementById('track-list');
    const emptyState = document.getElementById('empty-state');
    const refreshBtn = document.getElementById('refresh-btn');
    const searchInput = document.getElementById('search-input');
    const tabAll = document.getElementById('tab-all');
    const tabPlaylists = document.getElementById('tab-playlists');
    const viewAll = document.getElementById('view-all');
    const viewPlaylists = document.getElementById('view-playlists');
    const createPlaylistBtn = document.getElementById('create-playlist-btn');
    const playlistsContainer = document.getElementById('playlists-container');

    // Audio Elements
    const audio = document.getElementById('audio-element');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const repeatBtn = document.getElementById('repeat-btn');
    const seekBar = document.getElementById('seek-bar');
    const volumeBar = document.getElementById('volume-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalTimeEl = document.getElementById('total-time');
    const currentTitle = document.getElementById('current-title');

    lucide.createIcons();

    window.onload = () => {
      initGoogleAuth();
    };

    function initGoogleAuth() {
      if (window.google && google.accounts) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (response) => {
            if (response.access_token) {
              accessToken = response.access_token;
              updateStatus(true);
              fetchTracks();
            }
          },
        });
      }
    }

    authBtn.onclick = () => {
      if (!tokenClient) initGoogleAuth();
      tokenClient.requestAccessToken();
    };

    function updateStatus(connected) {
      if (connected) {
        statusBadge.className = 'hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-green-500/10 text-green-400 border border-green-500/20';
        statusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-green-400"></span><span>Conectado</span>';
        authBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i><span>Conectado</span>';
        authBtn.classList.replace('bg-green-500', 'bg-zinc-800');
        authBtn.classList.replace('text-zinc-950', 'text-zinc-300');
        lucide.createIcons();
      }
    }

    // Corregida la consulta a la API de Google Drive para evitar el Error 400
    async function fetchTracks() {
      if (!accessToken) return;

      emptyState.classList.add('hidden');
      trackList.innerHTML = `<div class="p-8 text-center text-zinc-500 text-sm">Cargando biblioteca desde Drive...</div>`;
      
      const query = "mimeType contains 'audio/' and trashed = false";
      // Formato seguro para la API v3 de Drive
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType)&pageSize=100`;

      try {
        const res = await fetch(url, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (res.status === 400 || res.status === 401) {
          trackList.innerHTML = `<div class="p-8 text-center text-amber-500 text-sm">La sesión ha caducado. Por favor, vuelve a hacer clic en "Conectar Drive".</div>`;
          return;
        }

        const data = await res.json();
        allTracks = data.files || [];
        currentQueue = [...allTracks];
        renderTracks(allTracks);
      } catch (err) {
        console.error('Error al cargar archivos:', err);
        trackList.innerHTML = `<div class="p-8 text-center text-rose-500 text-sm">Error al conectar con la API de Google Drive</div>`;
      }
    }

    refreshBtn.onclick = () => fetchTracks();

    function renderTracks(list) {
      trackList.innerHTML = '';
      if (list.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      list.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'group flex items-center justify-between p-3 rounded-xl hover:bg-zinc-900/80 cursor-pointer transition border border-transparent hover:border-zinc-800/50';
        
        item.innerHTML = `
          <div class="flex items-center gap-3 min-w-0 flex-1" onclick="playTrack(${index})">
            <div class="w-8 h-8 rounded-lg bg-zinc-800/60 flex items-center justify-center text-zinc-400 group-hover:text-green-400 transition">
              <i data-lucide="music" class="w-4 h-4"></i>
            </div>
            <div class="min-w-0">
              <p class="text-sm font-medium text-zinc-200 group-hover:text-white truncate">${track.name}</p>
              <p class="text-xs text-zinc-500">Pista de Audio</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="addToPlaylistPrompt('${track.id}', '${escapeQuotes(track.name)}')" title="Añadir a playlist" class="text-zinc-500 hover:text-green-400 p-2"><i data-lucide="plus-circle" class="w-4 h-4"></i></button>
            <button onclick="playTrack(${index})" class="text-zinc-500 group-hover:text-zinc-200 p-2"><i data-lucide="play-circle" class="w-5 h-5"></i></button>
          </div>
        `;
        trackList.appendChild(item);
      });
      lucide.createIcons();
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    async function playTrack(index) {
      if (index < 0 || index >= currentQueue.length) return;
      currentTrackIndex = index;
      const track = currentQueue[index];

      currentTitle.innerText = track.name;
      const streamUrl = `https://www.googleapis.com/drive/v3/files/${track.id}?alt=media`;

      try {
        const response = await fetch(streamUrl, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (response.status === 400 || response.status === 401) {
          alert('Tu sesión con Google Drive venció. Vuelve a hacer clic en Conectar Drive.');
          return;
        }

        const blob = await response.blob();
        audio.src = URL.createObjectURL(blob);
        audio.play();
        updatePlayState(true);

        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: track.name,
            artist: "Drive Music Player"
          });
        }
      } catch (err) {
        console.error('Error al reproducir:', err);
      }
    }

    // Player Handlers
    playBtn.onclick = () => {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        updatePlayState(true);
      } else {
        audio.pause();
        updatePlayState(false);
      }
    };

    prevBtn.onclick = () => playTrack(currentTrackIndex - 1);
    nextBtn.onclick = () => handleTrackNext();

    function handleTrackNext() {
      if (repeatMode === 2) {
        playTrack(currentTrackIndex);
      } else if (currentTrackIndex + 1 < currentQueue.length) {
        playTrack(currentTrackIndex + 1);
      } else if (repeatMode === 1) {
        playTrack(0);
      }
    }

    audio.onended = () => handleTrackNext();

    shuffleBtn.onclick = () => {
      isShuffle = !isShuffle;
      shuffleBtn.className = isShuffle ? 'text-green-400 transition' : 'text-zinc-500 hover:text-zinc-200 transition';
      if (isShuffle) {
        currentQueue = [...currentQueue].sort(() => Math.random() - 0.5);
      } else {
        currentQueue = [...allTracks];
      }
    };

    repeatBtn.onclick = () => {
      repeatMode = (repeatMode + 1) % 3;
      if (repeatMode === 0) {
        repeatBtn.className = 'text-zinc-500 hover:text-zinc-200 transition';
      } else {
        repeatBtn.className = 'text-green-400 transition';
      }
    };

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      seekBar.value = (audio.currentTime / audio.duration) * 100;
      currentTimeEl.innerText = formatTime(audio.currentTime);
      totalTimeEl.innerText = formatTime(audio.duration);
    };

    seekBar.oninput = (e) => {
      if (!audio.duration) return;
      audio.currentTime = (e.target.value / 100) * audio.duration;
    };

    volumeBar.oninput = (e) => audio.volume = e.target.value;

    function updatePlayState(isPlaying) {
      playBtn.innerHTML = isPlaying 
        ? `<i data-lucide="pause" class="w-5 h-5 fill-current"></i>` 
        : `<i data-lucide="play" class="w-5 h-5 fill-current translate-x-0.5"></i>`;
      lucide.createIcons();
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Tabs Navigation
    tabAll.onclick = () => {
      tabAll.className = 'px-4 py-3 text-sm font-semibold text-green-400 border-b-2 border-green-500 flex items-center gap-2 transition';
      tabPlaylists.className = 'px-4 py-3 text-sm font-medium text-zinc-400 border-b-2 border-transparent hover:text-zinc-200 flex items-center gap-2 transition';
      viewAll.classList.remove('hidden');
      viewPlaylists.classList.add('hidden');
      createPlaylistBtn.classList.add('hidden');
    };

    tabPlaylists.onclick = () => {
      tabPlaylists.className = 'px-4 py-3 text-sm font-semibold text-green-400 border-b-2 border-green-500 flex items-center gap-2 transition';
      tabAll.className = 'px-4 py-3 text-sm font-medium text-zinc-400 border-b-2 border-transparent hover:text-zinc-200 flex items-center gap-2 transition';
      viewPlaylists.classList.remove('hidden');
      viewAll.classList.add('hidden');
      createPlaylistBtn.classList.remove('hidden');
      renderPlaylists();
    };

    // Playlists Logic
    createPlaylistBtn.onclick = () => {
      const name = prompt('Nombre de la lista de reproducción:');
      if (name) {
        playlists.push({ id: Date.now(), name, tracks: [] });
        savePlaylists();
        renderPlaylists();
      }
    };

    function addToPlaylistPrompt(trackId, trackName) {
      if (playlists.length === 0) {
        alert('Crea primero una lista de reproducción en la pestaña "Listas de Reproducción".');
        return;
      }
      const names = playlists.map((p, i) => `${i + 1}. ${p.name}`).join('\n');
      const choice = prompt(`Selecciona el número de la lista para añadir "${trackName}":\n${names}`);
      const index = parseInt(choice) - 1;
      
      if (playlists[index]) {
        if (!playlists[index].tracks.some(t => t.id === trackId)) {
          playlists[index].tracks.push({ id: trackId, name: trackName });
          savePlaylists();
          alert(`Canción añadida a "${playlists[index].name}"`);
        } else {
          alert('La canción ya está en esta lista.');
        }
      }
    }

    function savePlaylists() {
      localStorage.setItem('gdrive_playlists', JSON.stringify(playlists));
    }

    function renderPlaylists() {
      playlistsContainer.innerHTML = '';
      if (playlists.length === 0) {
        playlistsContainer.innerHTML = `<div class="col-span-full p-8 text-center text-zinc-500 text-sm">No has creado listas de reproducción aún.</div>`;
        return;
      }

      playlists.forEach((pl) => {
        const card = document.createElement('div');
        card.className = 'bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-zinc-100 truncate">${pl.name}</h3>
            <span class="text-xs text-zinc-500">${pl.tracks.length} pistas</span>
          </div>
          <div class="flex gap-2">
            <button onclick="playPlaylist(${pl.id})" class="flex-1 py-2 bg-green-500 text-zinc-950 rounded-xl font-semibold text-xs hover:bg-green-400 transition">Reproducir</button>
            <button onclick="deletePlaylist(${pl.id})" class="p-2 border border-zinc-800 text-zinc-400 hover:text-rose-400 rounded-xl transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        `;
        playlistsContainer.appendChild(card);
      });
      lucide.createIcons();
    }

    function playPlaylist(id) {
      const pl = playlists.find(p => p.id === id);
      if (pl && pl.tracks.length > 0) {
        currentQueue = [...pl.tracks];
        playTrack(0);
      } else {
        alert('Esta lista está vacía.');
      }
    }

    function deletePlaylist(id) {
      if (confirm('¿Eliminar esta lista de reproducción?')) {
        playlists = playlists.filter(p => p.id !== id);
        savePlaylists();
        renderPlaylists();
      }
    }

    searchInput.oninput = (e) => {
      const q = e.target.value.toLowerCase();
      renderTracks(allTracks.filter(t => t.name.toLowerCase().includes(q)));
    };
  </script>
</body>
</html>
